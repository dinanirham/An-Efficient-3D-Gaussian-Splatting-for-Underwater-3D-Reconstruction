<svg id="fig2" xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Training schedule timeline, iterations 0 to 30000"><title>Figure 2 — the training schedule as run</title><style>#fig2 text{font-family:Consolas, "Courier New", monospace;fill:#48605F}#fig2 .lab{fill:#10201F;font-family:Arial, "Helvetica Neue", Helvetica, sans-serif;font-weight:600}#fig2 .tick{stroke:#CFDBDA;stroke-width:1}#fig2 .axis{stroke:#7C908F;stroke-width:1}#fig2 .geo{fill:#EDF2F2;stroke:#94A9A8}#fig2 .phys{fill:#EFEAF6;stroke:#7A5CA8}#fig2 .dens{fill:#EDF2F2;stroke:#94A9A8}#fig2 .m2{fill:#E4F1ED;stroke:#1F7A66}#fig2 .m3{fill:#E4F1ED;stroke:#1F7A66}#fig2 .burst{fill:#C8462E;stroke:none}#fig2 .sweep{fill:none;stroke:#C8462E;stroke-width:1.5}</style><rect width="900" height="250" fill="#fff"/>
      <!-- axis: x = 60 + it/30000*800 -->
      <line class="axis" x1="60" y1="210" x2="860" y2="210"/>
      <g class="tick">
        <line x1="60" y1="60" x2="60" y2="214"/>
        <line x1="326.7" y1="60" x2="326.7" y2="214"/>
        <line x1="460" y1="60" x2="460" y2="214"/>
        <line x1="593.3" y1="60" x2="593.3" y2="214"/>
        <line x1="646.7" y1="60" x2="646.7" y2="214"/>
        <line x1="860" y1="60" x2="860" y2="214"/>
      </g>
      <g font-size="11" text-anchor="middle">
        <text x="60" y="232">0</text>
        <text x="326.7" y="232">10 000</text>
        <text x="460" y="232">15 000</text>
        <text x="593.3" y="232">20 000</text>
        <text x="646.7" y="232">22 000</text>
        <text x="860" y="232">30 000</text>
      </g>

      <!-- row 1: loss regime -->
      <text class="lab" x="12" y="79" font-size="11">loss</text>
      <rect class="geo" x="60" y="66" width="266.7" height="20" rx="2"/>
      <text x="193" y="80" font-size="11" text-anchor="middle">raw render vs capture</text>
      <rect class="phys" x="326.7" y="66" width="533.3" height="20" rx="2"/>
      <text x="593" y="80" font-size="11" text-anchor="middle">composed through the medium model · 9 scalars fitted</text>

      <!-- row 2: density control -->
      <text class="lab" x="12" y="115" font-size="11">density</text>
      <rect class="dens" x="60" y="102" width="400" height="20" rx="2"/>
      <text x="260" y="116" font-size="10" text-anchor="middle">density control · M1: prune only · D: alpha detached</text>

      <!-- row 3: M2 events and bursts -->
      <text class="lab" x="12" y="151" font-size="11">M2</text>
      <rect class="m2" x="457" y="138" width="6" height="20"/>
      <rect class="burst" x="463" y="138" width="5.4" height="20"/>
      <text x="452" y="134" font-size="10" text-anchor="end">cut to 200 k · 200 medium-only steps</text>
      <rect class="m2" x="590.3" y="138" width="6" height="20"/>
      <rect class="burst" x="596.3" y="138" width="5.4" height="20"/>
      <text x="608" y="134" font-size="10" text-anchor="start">CDF prune · 200 steps</text>

      <!-- row 4: M3 -->
      <text class="lab" x="12" y="187" font-size="11">M3</text>
      <rect class="m3" x="646.7" y="174" width="213.3" height="20" rx="2"/>
      <text x="753" y="188" font-size="11" text-anchor="middle">quantisation-aware training</text>

      <!-- sweeps: at each event, pre and post, and every 2500 -->
      <g class="sweep">
        <circle cx="460" cy="164" r="3"/><circle cx="466" cy="164" r="3"/>
        <circle cx="593.3" cy="164" r="3"/><circle cx="599.3" cy="164" r="3"/>
        <circle cx="526.7" cy="164" r="3"/><circle cx="660" cy="164" r="3"/><circle cx="726.7" cy="164" r="3"/><circle cx="793.3" cy="164" r="3"/><circle cx="860" cy="164" r="3"/>
      </g>
      <text x="860" y="158" font-size="10" text-anchor="end">○ depth-range sweep</text>

      <!-- title -->
      <text class="lab" x="60" y="40" font-size="13">30 000 iterations · 43 000 optimiser steps (43 400 with M2's two bursts)</text>
    </svg>